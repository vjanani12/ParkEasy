<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parking | ParkEasy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🚗 ParkEasy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="parking.html">Find Parking</a></li>
                    <li class="nav-item"><a class="nav-link active" href="booking.html">Book Now</a></li>
                    <li class="nav-item"><a class="nav-link" href="mybookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->

    <!-- Booking Form Section Start -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4">
                    <h2 class="fw-bold text-center mb-4">Book Your Parking Slot</h2>
                    
                    <form id="bookingForm">
                        <!-- Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your name" required>
                        </div>

                        <!-- Vehicle Number -->
                        <div class="mb-3">
                            <label for="vehicleNo" class="form-label fw-bold">Vehicle Number</label>
                            <input type="text" class="form-control" id="vehicleNo" placeholder="e.g. TN 01 AB 1234" required>
                        </div>

                        <!-- Parking Location -->
                        <div class="mb-3">
                            <label for="parkingLocation" class="form-label fw-bold">Select Parking Location</label>
                            <select class="form-select" id="parkingLocation" required>
                                <option value="" selected disabled>Choose location...</option>
                                <option value="Chennai Central Parking">Chennai Central Parking</option>
                                <option value="Phoenix Mall Parking">Phoenix Mall Parking</option>
                                <option value="T Nagar Parking">T Nagar Parking</option>
                            </select>
                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label for="bookingDate" class="form-label fw-bold">Booking Date</label>
                            <input type="date" class="form-control" id="bookingDate" required>
                        </div>

                        <!-- Time -->
                        <div class="mb-3">
                            <label for="bookingTime" class="form-label fw-bold">Booking Time</label>
                            <input type="time" class="form-control" id="bookingTime" required>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold mt-3">✅ Confirm Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Booking Form Section End -->

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 ParkEasy. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.5.3.3/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <!-- Direct Booking Script to bypass any file/port issues -->
    <script>
        const bookingForm = document.getElementById('bookingForm');

        if (bookingForm) {
            bookingForm.addEventListener('submit', function(e) {
                e.preventDefault();

                // Get values
                const fullName = document.getElementById('fullName').value;
                const vehicleNo = document.getElementById('vehicleNo').value;
                const parkingLocation = document.getElementById('parkingLocation').value;
                const bookingDate = document.getElementById('bookingDate').value;
                const bookingTime = document.getElementById('bookingTime').value;

                // Create object
                const newBooking = {
                    id: Date.now(),
                    fullName,
                    vehicleNo,
                    parkingLocation,
                    bookingDate,
                    bookingTime
                };

                // Save to LocalStorage
                let bookings = JSON.parse(localStorage.getItem('parkEasyDirect')) || [];
                bookings.push(newBooking);
                localStorage.setItem('parkEasyDirect', JSON.stringify(bookings));

                // Redirect
                window.location.href = 'mybookings.html';
            });
        }
    </script>
</body>
</html>
