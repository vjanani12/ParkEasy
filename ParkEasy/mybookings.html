<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | ParkEasy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🚗 ParkEasy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="parking.html">Find Parking</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Book Now</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mybookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->

    <!-- My Bookings Section Start -->
    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">My Booked Slots</h2>
            <p class="text-muted">Manage your active parking reservations</p>
        </div>

        <div class="row" id="bookingsList">
            <!-- JavaScript will load bookings here -->
        </div>
    </div>
    <!-- My Bookings Section End -->

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 ParkEasy. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>

    <!-- Direct Loading Script -->
    <script>
        const bookingsList = document.getElementById('bookingsList');

        if (bookingsList) {
            let bookings = JSON.parse(localStorage.getItem('parkEasyDirect')) || [];

            if (bookings.length === 0) {
                bookingsList.innerHTML = `<div class="col-12 text-center"><p class="text-muted fs-5">No bookings found yet. Book your parking spot now!</p></div>`;
            } else {
                let html = '';
                bookings.forEach((booking) => {
                    html += `
                        <div class="col-md-4 mb-4">
                            <div class="card shadow-sm border-0 h-100">
                                <div class="card-body d-flex flex-column">
                                    <h4 class="card-title fw-bold text-dark">${booking.parkingLocation}</h4>
                                    <p class="text-muted mb-1">👤 <strong>Name:</strong> ${booking.fullName}</p>
                                    <p class="text-muted mb-1">🚗 <strong>Vehicle:</strong> ${booking.vehicleNo}</p>
                                    <p class="text-muted mb-1">📅 <strong>Date:</strong> ${booking.bookingDate}</p>
                                    <p class="text-muted mb-3">⏰ <strong>Time:</strong> ${booking.bookingTime}</p>
                                    <div class="mt-auto">
                                        <button onclick="cancelBooking(${booking.id})" class="btn btn-outline-danger w-100 fw-bold">Cancel Booking</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                bookingsList.innerHTML = html;
            }
        }

        function cancelBooking(id) {
            let bookings = JSON.parse(localStorage.getItem('parkEasyDirect')) || [];
            bookings = bookings.filter(b => b.id !== id);
            localStorage.setItem('parkEasyDirect', JSON.stringify(bookings));
            location.reload();
        }
    </script>
</body>
</html>
